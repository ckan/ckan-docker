apiVersion: batch/v1
kind: Job
metadata:
  name: ckan-rebuild-search
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckan
        app.kubernetes.io/component: reindex
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: reindex
          image: docker.io/ckan/ckan-base:2.11
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until ckan -c /srv/app/ckan.ini user show "$CKAN_SYSADMIN_NAME" \
                >/dev/null 2>&1; do
                echo "Waiting for CKAN initialization"
                sleep 5
              done
              ckan -c /srv/app/ckan.ini search-index rebuild
          envFrom:
            - configMapRef:
                name: ckan-config
            - secretRef:
                name: ckan-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
