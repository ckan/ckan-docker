name: Validate Kubernetes manifests

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Install Python parser dependency
        run: python3 -m pip install PyYAML==6.0.2

      - name: Render Kustomize targets
        run: |
          mkdir -p rendered
          kubectl kustomize kubernetes/base > rendered/ckan-base.yaml
          kubectl kustomize kubernetes/examples/single-node > rendered/ckan-example.yaml
          kubectl kustomize data-at-spark/kubernetes/int > rendered/ckan-int.yaml
          kubectl kustomize data-at-spark/kubernetes/prod > rendered/ckan-prod.yaml

      - name: Substitute a deterministic CKAN delivery digest for validation
        run: |
          python3 kubernetes/substitute_ckan_image.py \
            "test.registry.local/data-at-spark@sha256:1111111111111111111111111111111111111111111111111111111111111111" \
            rendered/ckan-int.yaml \
            rendered/ckan-prod.yaml

      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          args: >-
            -strict
            -summary
            -kubernetes-version 1.30.0
            /github/workspace/rendered

      - name: Validate restricted profile controls
        run: python3 kubernetes/validate_restricted_profile.py rendered/*.yaml

      - name: Check immutable image promotion contract
        run: python3 kubernetes/verify_shared_ckan_image.py rendered/ckan-int.yaml rendered/ckan-prod.yaml

      - name: Reject committed Secret resources
        run: |
          if grep -q '^kind: Secret$' rendered/*.yaml; then
            echo "The Kubernetes base must consume external Secrets, not render them"
            exit 1
          fi
