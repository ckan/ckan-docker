---
collections:
  # base_host, webhook_listener. Pinned to a tag, not `main` -- a floating
  # branch here would mean a routine re-provision could silently pick up
  # unreviewed changes to a role that manages sudo/systemd on a shared host.
  # v1.1.1: hardens the github_hmac trigger-rule (requires the
  # X-GitHub-Event: registry_package header and payload action ==
  # "published", not just a valid signature) and adds
  # webhook_listener_public_hostname for public Caddy exposure. (v1.1.0
  # had the same content but a stale galaxy.yml version field; v1.1.1
  # just fixes that metadata.)
  - name: https://github.com/BU-Spark/spark-ansible.git
    type: git
    version: v1.1.1
  # herbaria_runtime, from se-symbiota-private (private -- requires an SSH
  # identity with read access). Installed from a subdirectory of that repo,
  # not the repo root: se-symbiota-private also holds the Symbiota PHP
  # config overlay and app content this ansible/ directory has nothing to
  # do with. Pinned to an exact commit SHA, not a branch -- a branch name
  # is not a pin: a future install could silently retrieve different
  # privileged runtime code with no change here. Bump this SHA deliberately
  # -- this one is se-symbiota-private#20's merge commit into
  # dev-all-features (GHCR image defaults, landed after #19).
  - name: git+ssh://git@github.com/BU-Spark/se-symbiota-private.git#/containers/ansible/,eaebdff3c2ea5aeac975eed89cbde9da0cfbab6a
    type: git
