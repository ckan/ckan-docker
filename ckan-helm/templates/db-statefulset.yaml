xapiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "db"
  replicas: 1
  selector:
	  matchLabels:
  	  app: postgres
  template:
	  metadata:
  	  labels:
    	app: postgres
	  spec:
  	    containers:
    	    - name: db
      	    image: "{{ .Values.webapp.images.postgres }}:{{ .Values.webapp.tag }}"
      	    env:
              - name: CKAN_DB
                value: ckandb
              - name: CKAN_DB_PASSWORD
                value: ckandbpassword
              - name: CKAN_DB_USER
                value: ckandbuser
              - name: DATASTORE_DB
                value: datastore
              - name: DATASTORE_READONLY_PASSWORD
                value: datastore
              - name: DATASTORE_READONLY_USER
                value: datastore_ro
              - name: POSTGRES_DB
                value: postgres
              - name: POSTGRES_PASSWORD
                value: postgres
              - name: POSTGRES_USER
                value: postgres
      	    volumeMounts:
        	       - name: postgres-data
          	       mountPath:
  volumeClaimTemplates:
     	- metadata:
          name: pg-data
        spec:
    	   accessModes:
      	      - ReadWriteOnce
        resources:
          requests:
        	    storage: 10Gi
        storageClassName: standard
