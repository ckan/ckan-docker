apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr
spec:
  serviceName: solr
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckan
      app.kubernetes.io/component: search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckan
        app.kubernetes.io/component: search
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: solr
          image: docker.io/ckan/ckan-solr:2.11-solr9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 8983
          ports:
            - name: solr
              containerPort: 8983
          startupProbe:
            httpGet:
              path: /solr/
              port: solr
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /solr/
              port: solr
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /solr/
              port: solr
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/solr
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
