apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  10_create_ckandb.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" \
        -v "ckan_db_user=$CKAN_DB_USER" \
        -v "ckan_db_password=$CKAN_DB_PASSWORD" \
        -v "ckan_db=$CKAN_DB" <<-'EOSQL'
        CREATE ROLE :"ckan_db_user" NOSUPERUSER CREATEDB CREATEROLE LOGIN PASSWORD :'ckan_db_password';
        CREATE DATABASE :"ckan_db" OWNER :"ckan_db_user" ENCODING 'utf-8';
    EOSQL
  20_create_datastore.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" \
        -v "datastore_readonly_user=$DATASTORE_READONLY_USER" \
        -v "datastore_readonly_password=$DATASTORE_READONLY_PASSWORD" \
        -v "datastore_db=$DATASTORE_DB" \
        -v "ckan_db_user=$CKAN_DB_USER" <<-'EOSQL'
        CREATE ROLE :"datastore_readonly_user" NOSUPERUSER NOCREATEDB NOCREATEROLE LOGIN PASSWORD :'datastore_readonly_password';
        CREATE DATABASE :"datastore_db" OWNER :"ckan_db_user" ENCODING 'utf-8';
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckan
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckan
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ckan-secrets
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
