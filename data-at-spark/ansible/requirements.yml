---
collections:
  # base_host, webhook_listener. Pinned to a tag, not `main` -- a floating
  # branch here would mean a routine re-provision could silently pick up
  # unreviewed changes to a role that manages sudo/systemd on a shared host.
  # v1.2.0: installs webhook from its pinned, sha256-verified GitHub
  # release binary instead of `dnf install webhook` -- that package
  # doesn't exist for Fedora at all, discovered when the real int
  # deploy run actually failed on it. Also carries v1.1.x's
  # github_hmac trigger-rule hardening and webhook_listener_public_hostname.
  - name: https://github.com/BU-Spark/spark-ansible.git
    type: git
    version: v1.2.0
  # herbaria_runtime, from se-symbiota-private (private -- requires an SSH
  # identity with read access). Installed from a subdirectory of that repo,
  # not the repo root: se-symbiota-private also holds the Symbiota PHP
  # config overlay and app content this ansible/ directory has nothing to
  # do with. Pinned to an exact commit SHA, not a branch -- a branch name
  # is not a pin: a future install could silently retrieve different
  # privileged runtime code with no change here. Bump this SHA deliberately
  # -- this one is se-symbiota-private#26's merge commit into
  # dev-all-features: fixes symbiota.service.j2/herbaria-data.mount.j2/
  # env.j2 to match spark-shared-prod's real, already-working units
  # (ExecStartPre reconcile, parent-mount ordering, ENV_FILE=), found by
  # checking against them before the first-ever prod run of this role.
  - name: git+ssh://git@github.com/BU-Spark/se-symbiota-private.git#/containers/ansible/,7e43b841e57b32663e4a061dc9f91100e4e8864d
    type: git
