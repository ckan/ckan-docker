apiVersion: batch/v1
kind: Job
metadata:
  name: ckan-rebuild-search
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckan
        app.kubernetes.io/component: reindex
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reindex
          image: docker.io/ckan/ckan-base:2.11.5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 503
          command:
            - /bin/sh
            - -ec
            - |
              ckan config-tool /srv/app/ckan.ini ckan.datapusher.api_token=xxx
              attempt=1
              max_attempts=60
              until ckan -c /srv/app/ckan.ini user show "$CKAN_SYSADMIN_NAME" \
                >/dev/null 2>&1; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Timed out waiting for CKAN initialization" >&2
                  exit 1
                fi
                echo "Waiting for CKAN initialization ($attempt/$max_attempts)"
                attempt=$((attempt + 1))
                sleep 5
              done
              ckan -c /srv/app/ckan.ini search-index rebuild
          envFrom:
            - configMapRef:
                name: ckan-config
            - secretRef:
                name: ckan-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
