apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-secrets-webapp
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao-backend
    kind: SecretStore
  target:
    name: secrets-webapp
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: CKAN_SYSADMIN_NAME
      remoteRef:
        key: bonnland@ucar.edu/ckan_admin
        property: CKAN_ADMIN_USERNAME
    - secretKey: CKAN_SYSADMIN_PASSWORD
      remoteRef:
        key: bonnland@ucar.edu/ckan_admin
        property: CKAN_ADMIN_PASSWORD
    - secretKey: CKAN_SYSADMIN_EMAIL
      remoteRef:
        key: bonnland@ucar.edu/ckan_admin
        property: CKAN_ADMIN_EMAIL