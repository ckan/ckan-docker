apiVersion: batch/v1
kind: Job
metadata:
  name: ckan-initialize
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckan
        app.kubernetes.io/component: initialize
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 502
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: docker.io/ckan/ckan-base:2.11.5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 503
          command:
            - /bin/sh
            - -ec
            - |
              ckan config-tool /srv/app/ckan.ini ckan.datapusher.api_token=xxx
              python3 /srv/app/prerun.py
          envFrom:
            - configMapRef:
                name: ckan-config
            - secretRef:
                name: ckan-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /var/lib/ckan
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: ckan-storage
